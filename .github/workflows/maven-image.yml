name: Container image

# Builds a released version of a Spring Boot app (executable jar or war) into ghcr.io/nkk-it-utvikling/<repo>, for the
# local nkk-developer stack (nkk-developer#27). Called from a repo's own image.yml, after its Release workflow or by
# hand for an existing tag. Separate from maven-release.yml so a missing image never blocks a release or deploy.
#
# The image is the artifact on amazoncorretto:<jdk>-headless. Config is not baked in: the stack mounts it, see
# nkk-developer/.docker-config/apps. Tags: <version>, and latest unless `latest: false`. The package takes the
# visibility of the (private) repo through the source label; the last step fails if it can be pulled anonymously.
on:
  workflow_call:
    inputs:
      ref:
        description: Release tag (e.g. v26.11.1) or the commit it points at; the version is the tag on that commit
        type: string
        required: true
      jdk:
        type: number
        default: 21
      latest:
        description: Also tag the image as latest
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/nkk-it-utvikling/${{ github.event.repository.name }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0  # tags, for the version
    - name: Set up JDK
      uses: actions/setup-java@v5.7.0
      with:
        distribution: 'corretto'
        overwrite-settings: false
        java-version: ${{ inputs.jdk }}
        cache: maven
    - name: Configure Maven
      run: |
        mkdir -p ~/.m2
        echo "<settings>
                <servers>
                  <server><id>github</id><username>x-access-token</username><password>${{ secrets.GITHUB_TOKEN }}</password></server>
                  <server><id>github-nkk-tng</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-nkk-ecvo</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-nkk-prove</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-nkk-helse</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-nkk-dommer</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-nkk-intouch</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-nkk-okonomi</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-nkk-utstilling</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-nkk-utstilling-core</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-nkk-dyreidentitet</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-dyreidentitet-webservice-client</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-nkk-dyreidentitet-service</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-nkk-apache-tiles</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  <server><id>github-origin-legacy</id><username>x-access-token</username><password>${{ secrets.ORIGIN_PACKAGES_TOKEN }}</password></server>
                  <server><id>github-origin-gt-legacy</id><username>x-access-token</username><password>${{ secrets.ORIGIN_PACKAGES_TOKEN }}</password></server>
                </servers>
              </settings>" > ~/.m2/settings.xml
    - name: Build the release
      run: |
        TAG=$(git describe --tags --exact-match HEAD 2>/dev/null) || { echo "::error::No release tag on ${{ inputs.ref }}"; exit 1; }
        VERSION="${TAG#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        mvn --batch-mode versions:set -DnewVersion="$VERSION" -DprocessAllModules -DgenerateBackupPoms=false
        mvn --batch-mode -DskipTests clean package
    - name: Build the image
      run: |
        # The runnable artifact; Spring Boot keeps the plain one as *.original or *-plain.*
        mapfile -t artifacts < <(find target -maxdepth 1 -type f \( -name '*.jar' -o -name '*.war' \) \
          ! -name '*-plain.*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
        if [ "${#artifacts[@]}" -ne 1 ]; then
          echo "::error::Expected one jar or war in target/, found: ${artifacts[*]:-none}"
          exit 1
        fi
        mkdir -p image
        cp "${artifacts[0]}" image/app.jar
        cat > image/Dockerfile <<'DOCKERFILE'
        ARG JDK
        FROM amazoncorretto:${JDK}-headless
        ARG SOURCE
        ARG VERSION
        LABEL org.opencontainers.image.source="${SOURCE}" org.opencontainers.image.version="${VERSION}"
        # The working directory is where the apps keep files such as state.properties and their log
        WORKDIR /app
        COPY app.jar /app/app.jar
        ENV JAVA_OPTS=""
        ENTRYPOINT ["sh", "-c", "exec java $JAVA_OPTS -jar /app/app.jar \"$@\"", "--"]
        DOCKERFILE
        docker build -t "$IMAGE:$VERSION" --build-arg JDK=${{ inputs.jdk }} --build-arg VERSION="$VERSION" \
          --build-arg SOURCE="https://github.com/${{ github.repository }}" image
    - name: Publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        docker push "$IMAGE:$VERSION"
        if [ "${{ inputs.latest }}" = "true" ]; then
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
        fi
        docker logout ghcr.io
    - name: Check that the package is private
      run: |
        if out=$(docker manifest inspect "$IMAGE:$VERSION" 2>&1); then
          echo "::error::$IMAGE can be pulled without logging in; set the package to private"
          exit 1
        fi
        echo "$out" | grep -qiE 'unauthorized|denied' || { echo "::error::unexpected answer: $out"; exit 1; }
        echo "Anonymous pull refused: the package is private"
